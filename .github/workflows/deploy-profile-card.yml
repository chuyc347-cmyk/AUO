name: Deploy profile card to GitHub Pages

on:
  push:
    branches: [claude/tech-job-profile-card-site-l2wv6q, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profile card to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add ../site origin/gh-pages
          else
            git worktree add --detach ../site
            cd ../site && git checkout --orphan gh-pages && git rm -rf --quiet . && cd -
          fi
          mkdir -p ../site/profile-card
          cp tech-job-profile-card.html ../site/profile-card/index.html
          cp tech-job-profile-card.html ../site/tech-job-profile-card.html
          cd ../site
          touch .nojekyll
          git add -A
          git commit -m "Deploy profile card ${GITHUB_SHA}" || echo "nothing to deploy"
          git push origin HEAD:gh-pages
