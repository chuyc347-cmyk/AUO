name: Deploy talent risk map to GitHub Pages

on:
  push:
    branches: [claude/talent-risk-map-generator-cds299]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add talent risk map to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add ../site origin/gh-pages
          else
            git worktree add --detach ../site
            cd ../site && git checkout --orphan gh-pages && git rm -rf --quiet . && cd -
          fi
          mkdir -p ../site/talent-risk-map
          cp index.html ../site/talent-risk-map/index.html
          cd ../site
          touch .nojekyll
          git add -A
          git commit -m "Deploy talent risk map ${GITHUB_SHA}" || echo "nothing to deploy"
          git push origin HEAD:gh-pages
